[project]
name = "scbot-new"
version = "1.1.0"
description = "A plugin-kernel chat server: one turn, many plugins, zero dependencies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.protocol", "plugins"]
py-modules = ["serve", "app"]

[tool.pyright]
include = ["core", "plugins"]
typeCheckingMode = "standard"
