# 拒绝的台词（示例）
#
# 放在 `characters/world/<角色ID>-refusals.toml`。
#
# 什么时候用：这一轮根本没发生。限额用完了、被静音冷却中、照片没存下来、模型挂了。
# 页面版会用一句翻译过的提示；群里不行——群里那句话会被五十个人读到，所以必须像她说的。
#
# 两个场合各一组：
#   [group]  群里，有别人在看：短、留面子、不解释细节
#   [direct] 私聊，只有你们两个：可以更直、更不客气
#
# 可用的键（缺的用中性默认）：
#   too_long / cooling / quota / quota_none / photos / failed / other
#
# `{wait}`      → 「20 秒后」「3 分钟后」   中文用这个
#   `{wait_raw}`  → 「20 秒」「3 分钟」       日语等"动词在后"的语言用这个
# 一行里不放 `{wait}` 也可以：那就是不说还有多久。

[group]
too_long = "（……太长了，一次说短一点好不好？）"
cooling = "（……还没消气呢，{wait}再说。）"
quota = "（今天的力气用完了，{wait}再来。）"
quota_none = "（今天的力气用完了，明天再说吧。）"
photos = "（照片下次再看吧。）"
failed = "（……没听清，再说一次？）"
other = "（……现在答不上来，抱歉。）"

[direct]
too_long = "……太长了。短一点。"
cooling = "……还没消气呢，{wait}再说。"
quota = "今天的力气用完了，{wait}再来。"
quota_none = "今天的力气用完了。明天再说。"
photos = "照片下次吧。"
failed = "……没听清，再说一次。"
other = "……现在答不上来，抱歉。"
