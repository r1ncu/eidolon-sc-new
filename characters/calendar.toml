# 祝日表：这一部署认为「今天是休息日吗」的那份日历。
#
# 数据来源：日本内阁府公开 CSV（国民の祝日・休日月日）
#   https://www8.cao.go.jp/chosei/shukujitsu/syukujitsu.csv
# 含振替休日与「国民の休日」（CSV 里都写作「休日」）。周末不用写进来——`channels/calendar.py`
# 默认把周六周日记成休息日。
#
# **每年更新一次。** 表里没有的年份会退成「只看周末」：她照样作息，只是不知道祝日。
# 需要临时覆盖时用 `.env` 的 `QQ_HOLIDAYS`（额外放假）/ `QQ_WORKDAYS`（调休上班），
# 两者优先于这张表。

[calendar]
country = "JP"
timezone = "Asia/Tokyo"

[calendar.holidays]
