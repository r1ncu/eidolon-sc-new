# 一个「作品」——把它复制成 `works/<id>.toml` 再改（文件名就是 id，也可以在这里写明）。
#
# 每个作品一份：标题、事务所、以及「有人在聊作品本身」的话题词。
# **作品是平级的**：没有「主作品」，你演的第一个和后来加的第二个一样，都只是 works/ 里的一份。
# 角色表里 `work = "<id>"` 说自己属于哪一份；整台部署只有一个作品时可以不写。
#
# 角色各自的看法不在这里——那是 `packs/<id>/world.md`，因为「她怎么看这个作品」
# 因人而异，而「这个作品叫什么」不会。
#
# 没有作品文件时也能跑：提示词里就不出现作品名，也不会因为一句话扯到企划上。
# 全部字段都是可选的，写空等于没写。
#
# 只有**一个**作品、又不想建目录时，也可以直接放 `characters/work.toml`——那是单作品的简写，
# 不是「主作品」；一旦 `works/` 里有文件，它就不读了。

[work]
# 作品标识。角色表里的 `work` 写的就是它；也是「世界观」页分组用的键。
# 不写时用文件名（`works/sample.toml` → `sample`；`work.toml` → `default`）。
id = "sample"
title = "サンプル作品"
title_zh = "示例作品"
agency = "サンプル事務所"
agency_zh = "示例事务所"

[aliases]
# 命中这些词才注入 `world/meta.md`（作品/活动/制作侧的事实）。命中即注入、不命中不带——
# 加了太多词等于每轮都带，那就失去「按需」的意义。
words = [
  "生放送", "直播",
  "アニメ", "动画",
  "ゲーム", "游戏",
  "ライブ", "演唱会",
  "イベント", "活动",
]

[privacy]
# 打包/发布时要挡住的词（作品层）。角色名由打包工具从角色册和角色包补。
forbidden = []
