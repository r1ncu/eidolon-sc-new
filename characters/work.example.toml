# 这一部署演的是什么「作品」——把本文件复制成 `work.toml` 再改。
#
# 共享层只有这一份：作品的标题、事务所、以及「有人在聊作品本身」的话题词。
# 角色各自的看法不在这里——那是 `packs/<id>/world.md`，因为「她怎么看这个作品」
# 因人而异，而「这个作品叫什么」不会。
#
# 没有 `work.toml` 时也能跑：提示词里就不出现作品名，也不会因为一句话扯到企划上。
# 全部字段都是可选的，写空等于没写。

[work]
title = "サンプル作品"
title_zh = "示例作品"
agency = "サンプル事務所"
agency_zh = "示例事务所"

[aliases]
# 命中这些词才注入 `world/meta.md`（作品/活动/制作侧的事实）。命中即注入、不命中不带——
# 加了太多词等于每轮都带，那就失去「按需」的意义。
words = [
  "生放送", "直播",
  "アニメ", "动画",
  "ゲーム", "游戏",
  "ライブ", "演唱会",
  "イベント", "活动",
]

[privacy]
# 打包/发布时要挡住的词（作品层）。角色名由打包工具从角色册和角色包补。
forbidden = []
